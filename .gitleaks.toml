title = "project-kb"

# Without this, a repo-local config REPLACES gitleaks' built-in ruleset
# (GitHub PATs, AWS keys, Slack tokens, private keys, etc. would pass undetected).
[extend]
useDefault = true

# A generic catch-all on top of the built-ins: a long secret-looking value
# assigned to a key/secret/token/password field (e.g. pasted from a .env file).
[[rules]]
id = "generic-secret-assignment"
description = "Generic long secret-looking value assigned to a secret/token/password/key field"
regex = '''(?i)(api[_-]?key|access[_-]?key|secret|token|password|private[_-]?key)\s*[:=]\s*["']?[A-Za-z0-9_./+=:-]{20,}'''
keywords = ["api_key", "apikey", "api-key", "access_key", "access-key", "secret", "token", "password", "private_key", "private-key"]

# False positives: add an allowlist here rather than bypassing the hook, e.g.
# [allowlist]
# paths = ['''^raw/transcripts/''']
